t;\" style=\"rounded=1;whiteSpace=wrap;html=1;arcSize=12;fillColor=#EFF6FF;strokeColor=#3B82F6;strokeWidth=2;fontFamily=Arial;fontSize=18;fontColor=#1D4ED8;align=left;verticalAlign=top;spacingTop=12;spacingLeft=16;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"310\" y=\"90\" width=\"560\" height=\"205\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"staff_geom\" value=\"Staff geometry&lt;br&gt;&amp; pitch grid\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#60A5FA;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"340\" y=\"155\" width=\"125\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"detector\" value=\"DEIM-D-FINE&lt;br&gt;symbol boxes\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#60A5FA;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"495\" y=\"155\" width=\"125\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"sam\" value=\"SAM2 prompts&lt;br&gt;&amp; masks\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#60A5FA;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"650\" y=\"155\" width=\"105\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"graph\" value=\"Relations +&lt;br&gt;MusicXML/LMX\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#60A5FA;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"785\" y=\"155\" width=\"105\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"a1\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#3B82F6;\" edge=\"1\" parent=\"1\" source=\"staff_geom\" target=\"detector\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"a2\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#3B82F6;\" edge=\"1\" parent=\"1\" source=\"detector\" target=\"sam\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"a3\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#3B82F6;\" edge=\"1\" parent=\"1\" source=\"sam\" target=\"graph\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"transfer_lane\" value=\"&lt;b&gt;Path B: Controlled sequence-model transfer&lt;/b&gt;\" style=\"rounded=1;whiteSpace=wrap;html=1;arcSize=12;fillColor=#FFF7ED;strokeColor=#F97316;strokeWidth=2;fontFamily=Arial;fontSize=18;fontColor=#C2410C;align=left;verticalAlign=top;spacingTop=12;spacingLeft=16;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"310\" y=\"330\" width=\"560\" height=\"205\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"released\" value=\"Released&lt;br&gt;Zeus / SMT weight\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#FB923C;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"340\" y=\"395\" width=\"130\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"budget\" value=\"Target labels&lt;br&gt;&lt;b&gt;0 / 100 / 1000&lt;/b&gt;\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#FB923C;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"505\" y=\"395\" width=\"130\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"adapt\" value=\"Fixed-epoch training&lt;br&gt;+ low-LR continuation\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#FB923C;strokeWidth=1.5;fontFamily=Arial;fontSize=14;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"670\" y=\"395\" width=\"170\" height=\"72\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"b1\" value=\"initialize\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#F97316;fontFamily=Arial;fontSize=12;\" edge=\"1\" parent=\"1\" source=\"released\" target=\"budget\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"b2\" value=\"fine-tune\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#F97316;fontFamily=Arial;fontSize=12;\" edge=\"1\" parent=\"1\" source=\"budget\" target=\"adapt\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"eval\" value=\"&lt;b&gt;Common evaluation&lt;/b&gt;&lt;br&gt;&lt;br&gt;Official LMX SER \u2193&lt;br&gt;SER without tuplets \u2193&lt;br&gt;proxy SER/CER where required&lt;br&gt;&lt;br&gt;Failure taxonomy:&lt;br&gt;pitch \u00b7 duration \u00b7 voice \u00b7 structure\" style=\"rounded=1;whiteSpace=wrap;html=1;arcSize=14;fillColor=#ECFDF5;strokeColor=#10B981;strokeWidth=2;fontFamily=Arial;fontSize=15;align=center;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"940\" y=\"190\" width=\"220\" height=\"275\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"fanin_a\" value=\"structured output\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#10B981;fontFamily=Arial;fontSize=12;\" edge=\"1\" parent=\"1\" source=\"graph\" target=\"eval\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"fanin_b\" value=\"decoded output\" style=\"edgeStyle=orthogonalEdgeStyle;html=1;endArrow=classic;endFill=1;strokeWidth=2;strokeColor=#10B981;fontFamily=Arial;fontSize=12;\" edge=\"1\" parent=\"1\" source=\"adapt\" target=\"eval\"><mxGeometry relative=\"1\" as=\"geometry\"/></mxCell>\n        <mxCell id=\"note\" value=\"Same splits and metric implementation are retained across budgets; released architectures are reported separately from our modular pipeline.\" style=\"text;html=1;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;fontFamily=Arial;fontSize=13;fontColor=#4B5563;fontStyle=2;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"220\" y=\"575\" width=\"760\" height=\"35\" as=\"geometry\"/></mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n";
const diagramTitle = "staff_overview.drawio";
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), '*');
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), '*')
};
window.addEventListener('message', (evt) => {
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), '*');
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
